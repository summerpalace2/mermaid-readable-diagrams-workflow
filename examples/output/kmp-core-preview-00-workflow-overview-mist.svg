<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1200" viewBox="0 0 3200 1200" role="img" aria-label="Mermaid 可读技术流程图生成工作流" data-theme="mist" data-baseline="inline:workflow-overview-baselineModel" data-baseline-ranks="S1:0,S2:1,S3:2,S4:3,S5:4,S6:5,S7:6" data-layout-model="baseline-rank-order-plus-dynamic-cards" data-symmetry-mode="none" data-symmetry-axis="none" data-symmetry-pairs="" data-symmetry-edge-pairs="" data-symmetry-public-spines="" data-arrow-width="16" data-arrow-height="12" data-source="examples/mermaid/workflow-overview.mmd">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DDE5EF" stroke-width="1.2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#26394F" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 Z" fill="#26394F"/></marker>
    <style>text{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
  </defs>
  <rect width="3200" height="1200" fill="#F4F7FB"/><rect width="3200" height="1200" fill="url(#grid)"/>
  <text x="1600" y="70" font-size="30" font-weight="750" text-anchor="middle" fill="#687A91">Mermaid 可读技术流程图生成工作流</text>
  <text x="1600" y="114" font-size="21" font-weight="600" text-anchor="middle" fill="#687A91">从语义源到可复核 SVG：先约束，再布局，最后发布</text>
  <text x="315" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 1</text><text x="738.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 2</text><text x="1147.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 3</text><text x="1560.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 4</text><text x="1998.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 5</text><text x="2436.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 6</text><text x="2874.5" y="442" font-size="20" font-weight="700" text-anchor="middle" fill="#687A91">阶段 7</text><path data-edge="S1-&gt;S2" d="M499.5 570 H547.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S2-&gt;S3" d="M929.5 570 H977.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S3-&gt;S4" d="M1317.5 570 H1365.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S4-&gt;S5" d="M1755.5 570 H1803.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S5-&gt;S6" d="M2193.5 570 H2241.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S6-&gt;S7" d="M2631.5 570 H2679.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="S1"><rect x="130.5" y="468" width="369" height="204" rx="12" fill="#CFE0F4" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="315" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="315" dy="0">01 入口</tspan><tspan x="315" dy="37">内容 → Mermaid（可选）</tspan><tspan x="315" dy="37">询问主题模式</tspan><tspan x="315" dy="37">读取 Mermaid 源码</tspan></text></g><g data-node="S2"><rect x="547.5" y="468" width="382" height="204" rx="12" fill="#FFFFFF" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="738.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="738.5" dy="0">02 语义与基线</tspan><tspan x="738.5" dy="37">sourceModel 内容清单</tspan><tspan x="738.5" dy="37">Mermaid 原始布局</tspan><tspan x="738.5" dy="37">baselineModel / rank</tspan></text></g><g data-node="S3"><rect x="977.5" y="468" width="340" height="204" rx="12" fill="#DCD9EE" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1147.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1147.5" dy="0">03 卡片与锚点</tspan><tspan x="1147.5" dy="37">Constraint IR</tspan><tspan x="1147.5" dy="37">计算 rank 与锚点</tspan><tspan x="1147.5" dy="37">测量文字 → 动态卡片</tspan></text></g><g data-node="S4"><rect x="1365.5" y="468" width="390" height="204" rx="12" fill="#D2E7DF" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1560.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1560.5" dy="0">04 通道与路由</tspan><tspan x="1560.5" dy="37">预留端口 / 独立 lane</tspan><tspan x="1560.5" dy="37">声明对称与 publicSpine</tspan><tspan x="1560.5" dy="37">复杂图生成 ≥2 候选</tspan></text></g><g data-node="S5"><rect x="1803.5" y="468" width="390" height="204" rx="12" fill="#F4E6B4" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1998.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1998.5" dy="0">05 硬门禁与选优</tspan><tspan x="1998.5" dy="37">过滤穿卡 / 交叉 / 反向入边</tspan><tspan x="1998.5" dy="37">视觉风险评分</tspan><tspan x="1998.5" dy="37">选优正交路线</tspan></text></g><g data-node="S6"><rect x="2241.5" y="468" width="390" height="204" rx="12" fill="#D2E7DF" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2436.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2436.5" dy="0">06 渲染与全景验收</tspan><tspan x="2436.5" dy="37">标签底牌 → SVG</tspan><tspan x="2436.5" dy="37">内容 / rank / 端点法向</tspan><tspan x="2436.5" dy="37">几何 / 对称 / 风险 / 全路径</tspan></text></g><g data-node="S7"><rect x="2679.5" y="468" width="390" height="204" rx="12" fill="#D2E7DF" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2874.5" y="514.5" font-size="28" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2874.5" dy="0">07 回归与发布</tspan><tspan x="2874.5" dy="37">自动发现全部 SVG</tspan><tspan x="2874.5" dy="37">生成预览 → 用户逐图确认</tspan><tspan x="2874.5" dy="37">更新正文与交互页</tspan></text></g>
</svg>