<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-label="Job 树与异常传播：普通作用域 vs supervisorScope" data-theme="warm" data-baseline="kmp-core-preview-07-job-exception-mermaid-baseline.svg" data-baseline-ranks="S:5,SA:3,SB:7,SD:3,SAwait:3,SFail:0,SHandle:6,P:2,A:1,B:4,AF:1,D:1,Await:1,Throw:1,PF:1,Cancel:1" data-layout-model="baseline-rank-order-plus-readable-routes" data-symmetry-mode="partial" data-symmetry-axis="supervisor-children:vertical=1800;supervisor-outcomes:vertical=1800" data-symmetry-pairs="SA/SB;SFail/SHandle" data-symmetry-edge-pairs="S-&gt;SA/S-&gt;SB;SAwait-&gt;SFail/SAwait-&gt;SHandle" data-symmetry-public-spines="" data-arrow-width="16" data-arrow-height="12" data-symmetry-reason="supervisorScope 的两个子协程和最终处理结果具有局部镜像关系；普通作用域链与 supervisorScope 语义不同，不宣称整图对称">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#EFE1D1" stroke-width="1.2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#26394F" flood-opacity="0.18"/></filter>
     <marker id="arrow" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 Z" fill="#26394F"/></marker>
    <style>text{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
  </defs>
  <rect width="2400" height="1200" fill="#FFF8ED"/><rect width="2400" height="1200" fill="url(#grid)"/>
  <text x="1200" y="62" font-size="26" font-weight="700" text-anchor="middle" fill="#786B63">Job 树与异常传播：普通作用域 vs supervisorScope</text><g data-zone="normal-job"><rect x="60" y="95" width="1080" height="1080" rx="20" fill="#FFFDF7" fill-opacity="0.72" stroke="#E6CDAF" stroke-width="2.2"/><text x="84" y="129" font-size="22" font-weight="750" fill="#786B63">普通 Parent Job</text></g><g data-zone="supervisor-job"><rect x="1260" y="95" width="1080" height="1080" rx="20" fill="#FFF6E7" fill-opacity="0.72" stroke="#E6CDAF" stroke-width="2.2"/><text x="1284" y="129" font-size="22" font-weight="750" fill="#786B63">supervisorScope</text></g><g data-node="P"><rect x="454" y="128.5" width="292" height="83" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="600" y="170" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="600" dy="0">普通 Parent Job</tspan></text></g><g data-node="A"><rect x="227" y="258.5" width="266" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="300" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">Child async A</tspan></text></g><g data-node="B"><rect x="699" y="258.5" width="282" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="840" y="300" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="840" dy="0">Child launch B</tspan></text></g><g data-node="AF"><rect x="250" y="408.5" width="220" height="83" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="450" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">A 执行失败</tspan></text></g><g data-node="D"><rect x="182.5" y="558.5" width="355" height="83" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="600" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">异常保存在 Deferred</tspan></text></g><g data-node="Await"><rect x="236" y="708.5" width="248" height="83" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="750" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">调用 await()</tspan></text></g><g data-node="Throw"><rect x="240" y="858.5" width="240" height="83" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="900" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">异常重新抛出</tspan></text></g><g data-node="PF"><rect x="152" y="989" width="416" height="122" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="360" y="1030.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="360" dy="0">未捕获：Parent scope 失</tspan><tspan x="360" dy="39">败</tspan></text></g><g data-node="Cancel"><rect x="730" y="1008.5" width="220" height="83" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="840" y="1050" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="840" dy="0">B 被取消</tspan></text></g><g data-node="S"><rect x="1643.5" y="128.5" width="313" height="83" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1800" y="170" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1800" dy="0">supervisorScope</tspan></text></g><g data-node="SA"><rect x="1459" y="258.5" width="282" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1600" y="300" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1600" dy="0">Child async A</tspan></text></g><g data-node="SB"><rect x="1859" y="258.5" width="282" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2000" y="300" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2000" dy="0">Child launch B</tspan></text></g><g data-node="SD"><rect x="1608" y="458.5" width="384" height="83" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1800" y="500" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1800" dy="0">A 失败：先不自动取消 B</tspan></text></g><g data-node="SAwait"><rect x="1586" y="639" width="428" height="122" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1800" y="680.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1800" dy="0">await() 后由调用方决定是</tspan><tspan x="1800" dy="39">否捕获</tspan></text></g><g data-node="SFail"><rect x="1302.5" y="938.5" width="395" height="83" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1500" y="980" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1500" dy="0">未捕获：scope 仍会失败</tspan></text></g><g data-node="SHandle"><rect x="1902.5" y="938.5" width="395" height="83" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2100" y="980" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2100" dy="0">捕获并处理：B 可继续</tspan></text></g><path data-edge="P-&gt;A" d="M454 170 H360 V258.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="P-&gt;B" d="M746 170 H840 V258.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="A-&gt;AF" d="M360 341.5 V408.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="AF-&gt;D" d="M360 491.5 V558.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="D-&gt;Await" d="M360 641.5 V708.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Await-&gt;Throw" d="M360 791.5 V858.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Throw-&gt;PF" d="M360 941.5 V989" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="PF-&gt;Cancel" d="M568 1050 H730" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S-&gt;SA" d="M1643.5 170 H1600 V258.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="S-&gt;SB" d="M1956.5 170 H2000 V258.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="SA-&gt;SD" d="M1600 341.5 H1800 V458.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="SD-&gt;SAwait" d="M1800 541.5 V639" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="SAwait-&gt;SFail" d="M1586 700 H1500 V938.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="SAwait-&gt;SHandle" d="M2014 700 H2100 V938.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>