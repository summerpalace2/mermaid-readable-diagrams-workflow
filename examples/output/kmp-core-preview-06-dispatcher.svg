<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125" role="img" aria-label="Dispatcher 选择：先判断工作性质" data-theme="warm" data-baseline="kmp-core-preview-06-dispatcher-mermaid-baseline.svg" data-baseline-ranks="Work:3,UI:3,CPU:2,Block:1,Caller:0,Main:5,Default:6,IO:4" data-layout-model="baseline-rank-order-plus-readable-routes" data-symmetry-mode="none" data-symmetry-axis="symmetry:none=0" data-symmetry-pairs="" data-symmetry-edge-pairs="" data-symmetry-public-spines="" data-arrow-width="16" data-arrow-height="12" data-symmetry-reason="决策链向下推进，命中条件后向右收敛到不同 dispatcher，不强行镜像">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#EFE1D1" stroke-width="1.2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#26394F" flood-opacity="0.18"/></filter>
     <marker id="arrow" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,6 L0,12 Z" fill="#26394F"/></marker>
    <style>text{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
  </defs>
  <rect width="2000" height="1125" fill="#FFF8ED"/><rect width="2000" height="1125" fill="url(#grid)"/>
  <text x="1000" y="62" font-size="26" font-weight="700" text-anchor="middle" fill="#786B63">Dispatcher 选择：先判断工作性质</text><g data-zone="decision-chain"><rect x="480" y="90" width="560" height="970" rx="20" fill="#FFFDF7" fill-opacity="0.72" stroke="#E6CDAF" stroke-width="2.2"/><text x="504" y="124" font-size="22" font-weight="750" fill="#786B63">逐层判断</text></g><g data-zone="dispatcher-outcomes"><rect x="1220" y="250" width="650" height="650" rx="20" fill="#FFF6E7" fill-opacity="0.72" stroke="#E6CDAF" stroke-width="2.2"/><text x="1244" y="284" font-size="22" font-weight="750" fill="#786B63">执行上下文</text></g><g data-node="Work"><rect x="616.5" y="118.5" width="287" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="760" y="160" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="760" dy="0">这段工作是什么?</tspan></text></g><g data-node="UI"><rect x="544" y="318.5" width="432" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="760" y="360" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="760" dy="0">需要更新 UI 或主线程 API?</tspan></text></g><g data-node="CPU"><rect x="645.5" y="518.5" width="229" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="760" y="560" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="760" dy="0">CPU-heavy?</tspan></text></g><g data-node="Block"><rect x="646.5" y="718.5" width="227" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="760" y="760" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="760" dy="0">会阻塞线程?</tspan></text></g><g data-node="Caller"><rect x="546" y="909" width="428" height="122" rx="14" fill="#ECE7DE" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="760" y="950.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="760" dy="0">保持当前上下文 / 遵循库契</tspan><tspan x="760" dy="39">约</tspan></text></g><g data-node="Main"><rect x="1390" y="318.5" width="220" height="83" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1500" y="360" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1500" dy="0">Main</tspan></text></g><g data-node="Default"><rect x="1390" y="518.5" width="220" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1500" y="560" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1500" dy="0">Default</tspan></text></g><g data-node="IO"><rect x="1390" y="718.5" width="220" height="83" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1500" y="760" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1500" dy="0">IO</tspan></text></g><path data-edge="Work-&gt;UI" d="M760 201.5 V318.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="UI-&gt;CPU" d="M760 401.5 V518.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="CPU-&gt;Block" d="M760 601.5 V718.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Block-&gt;Caller" d="M760 801.5 V909" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="UI-&gt;Main" d="M976 360 H1390" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="CPU-&gt;Default" d="M874.5 560 H1390" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Block-&gt;IO" d="M873.5 760 H1390" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="775.5" y="440" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="798" y="460" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">否</text></g><g><rect x="775.5" y="640" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="798" y="660" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">否</text></g><g><rect x="775.5" y="835.25" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="798" y="855.25" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">否</text></g><g><rect x="1160.5" y="310" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1183" y="330" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">是</text></g><g><rect x="1109.75" y="510" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1132.25" y="530" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">是</text></g><g><rect x="1109.25" y="710" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1131.75" y="730" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">是</text></g>
</svg>