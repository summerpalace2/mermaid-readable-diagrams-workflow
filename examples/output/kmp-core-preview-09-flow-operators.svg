<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 2400 1200" role="img" aria-label="Flow 操作符选择：先判断每个值、最新值与取消边界" data-theme="warm" data-baseline="kmp-core-preview-09-flow-operators-mermaid-baseline.svg" data-baseline-ranks="Input:0,Every:1,Slow:2,Buffer:3,Collect:3,Latest:2,Conflate:3,LatestWork:3,CollectLatest:4,FlatLatest:4" data-layout-model="baseline-rank-order-plus-readable-routes" data-symmetry-mode="partial" data-symmetry-axis="every-split:horizontal=600;slow-choice:horizontal=350;latest-choice:horizontal=850;cancel-choice:horizontal=980.5" data-symmetry-pairs="Slow/Latest;Buffer/Collect;Conflate/LatestWork;CollectLatest/FlatLatest" data-symmetry-edge-pairs="Every-&gt;Slow/Every-&gt;Latest" data-symmetry-public-spines="" data-arrow-width="16" data-arrow-height="12" data-symmetry-reason="决策树的四组兄弟分支可以局部镜像，但整张图不是完整镜像结构">
  <defs>
