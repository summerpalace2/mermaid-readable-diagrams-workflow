  </defs>
  <rect width="2400" height="1200" fill="#FFF8ED"/><rect width="2400" height="1200" fill="url(#grid)"/>
  <text x="1200" y="62" font-size="26" font-weight="700" text-anchor="middle" fill="#786B63">Flow 操作符选择：先判断每个值、最新值与取消边界</text><g data-node="Input"><rect x="110" y="558.5" width="240" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="230" y="600" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="230" dy="0">数据连续产生</tspan></text></g><g data-node="Every"><rect x="491.5" y="558.5" width="317" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="650" y="600" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="650" dy="0">每个值都必须处理?</tspan></text></g><g data-node="Slow"><rect x="906.5" y="308.5" width="287" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1050" y="350" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1050" dy="0">消费者可能变慢?</tspan></text></g><g data-node="Buffer"><rect x="1444.5" y="178.5" width="311" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1600" y="220" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1600" dy="0">buffer：排队保留</tspan></text></g><g data-node="Collect"><rect x="1421" y="438.5" width="358" height="83" rx="14" fill="#FFFFFF" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1600" y="480" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1600" dy="0">collect：按顺序处理</tspan></text></g><g data-node="Latest"><rect x="906.5" y="808.5" width="287" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1050" y="850" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1050" dy="0">只关心最新状态?</tspan></text></g><g data-node="Conflate"><rect x="1382.5" y="639" width="435" height="122" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1600" y="680.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1600" dy="0">conflate：当前继续，中间</tspan><tspan x="1600" dy="39">值可丢</tspan></text></g><g data-node="LatestWork"><rect x="1441.5" y="939" width="317" height="83" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1600" y="980.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1600" dy="0">旧的处理也应取消?</tspan></text></g><g data-node="CollectLatest"><rect x="1885.5" y="829.5" width="429" height="122" rx="14" fill="#F4D2C5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2100" y="871" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2100" dy="0">collectLatest：取消旧下</tspan><tspan x="2100" dy="39">游处理</tspan></text></g><g data-node="FlatLatest"><rect x="1900.5" y="1009.5" width="399" height="122" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2100" y="1051" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2100" dy="0">flatMapLatest：取消旧</tspan><tspan x="2100" dy="39">inner Flow / 数据源</tspan></text></g><path data-edge="Input-&gt;Every" d="M350 600 H491.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Slow-&gt;Buffer" d="M1193.5 330 H1351 V220 H1444.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Slow-&gt;Collect" d="M1193.5 370 H1351 V480 H1421" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Latest-&gt;Conflate" d="M1193.5 830 H1312.5 V700 H1382.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Latest-&gt;LatestWork" d="M1193.5 870 H1312.5 V1000 H1441.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="LatestWork-&gt;CollectLatest" d="M1758.5 960.5 H1828.5 V890.5 H1885.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="LatestWork-&gt;FlatLatest" d="M1758.5 1000.5 H1828.5 V1070.5 H1900.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Every-&gt;Slow" d="M808.5 576 H878.5 V350 H906.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Every-&gt;Latest" d="M808.5 624 H878.5 V850 H906.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="1288.5" y="250" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1311" y="270" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">是</text></g><g><rect x="1288.5" y="410" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1311" y="430" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">否</text></g><g><rect x="1250" y="750" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1272.5" y="770" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle">是</text></g><g><rect x="1250" y="910" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="1272.5" y="930" font-size="21" font-weight="750" text-