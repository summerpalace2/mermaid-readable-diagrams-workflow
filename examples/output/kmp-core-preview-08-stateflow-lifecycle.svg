p="round" marker-end="url(#arrow)"/><path data-edge="sequence-10" d="M1450 1150 H2130" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="818" y="191" width="64" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="850" y="210" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="850" dy="0">订阅</tspan></text></g><g><rect x="1653" y="281" width="274" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1790" y="300" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1790" dy="0">首个订阅者出现，开始收集</tspan></text></g><g><rect x="1737" y="371" width="106" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1790" y="390" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1790" dy="0">发射状态</tspan></text></g><g><rect x="797" y="461" width="106" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="850" y="480" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="850" dy="0">当前状态</tspan></text></g><g><rect x="744.5" y="561" width="211" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="850" y="580" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="850" dy="0">页面离开，取消收集</tspan></text></g><g><rect x="1427" y="641" width="178" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1516" y="660" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1516" dy="0">subscriber = 0</tspan></text></g><g><rect x="1402.5" y="707" width="227" height="66" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1516" y="726" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1516" dy="0">WhileSubscribed 等</tspan><tspan x="1516" dy="28">待 stopTimeout</tspan></text></g><g><rect x="1684.5" y="811" width="211" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1790" y="830" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1790" dy="0">超时后停止上游收集</tspan></text></g><g><rect x="744.5" y="911" width="211" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="850" y="930" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="850" dy="0">页面回来，重新订阅</tspan></text></g><g><rect x="755" y="1001" width="190" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="850" y="1020" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="850" dy="0">先返回最后一个值</tspan></text></g><g><rect x="1695" y="1091" width="190" height="38" rx="7" fill="#FFF8ED" fill-opacity="0.94"/><text x="1790" y="1110" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1790" dy="0">重新开始上游收集</tspan></text></g><g data-node="UI"><rect x="99.5" y="112" width="301" height="76" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="250" y="150" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="250" dy="0">Compose / SwiftUI</tspan></text></g><g data-node="VM"><rect x="695" y="112" width="250" height="76" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="820" y="150" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="820" dy="0">ViewModel</tspan></text></g><g data-node="SF"><rect x="1325" y="112" width="250" height="76" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1450" y="150" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1450" dy="0">StateFlow</tspan></text></g><g data-node="UP"><rect x="2005" y="112" width="250" height="76" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2130" y="150" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2130" dy="0">Upstream Flow</tspan></text></g>
