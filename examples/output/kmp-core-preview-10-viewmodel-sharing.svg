  <text x="1200" y="62" font-size="26" font-weight="700" text-anchor="middle" fill="#786B63">是否共享 ViewModel：从展示逻辑到互操作成本</text><g data-node="UI"><rect x="63" y="598.5" width="234" height="83" rx="14" fill="#D6E6F5" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="180" y="640" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="180" dy="0">两端 UI 不同</tspan></text></g><g data-node="Logic"><rect x="410" y="579" width="420" height="122" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="620" y="640" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="620" dy="0">展示逻辑是否基本一致?</tspan></text></g><g data-node="Native"><rect x="689" y="958.5" width="402" height="83" rx="14" fill="#ECE7DE" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="890" y="1000" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="890" dy="0">保留平台各自 ViewModel</tspan></text></g><g data-node="Cost"><rect x="950" y="579" width="420" height="122" rx="14" fill="#F6DEA6" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1160" y="620.5" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1160" dy="0">互操作与生命周期成本可接</tspan><tspan x="1160" dy="39">受?</tspan></text></g><g data-node="Shared"><rect x="1580.5" y="199.5" width="299" height="161" rx="14" fill="#E8D8EB" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1730" y="241" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1730" dy="0">共享 commonMain</tspan><tspan x="1730" dy="39">Presentation +</tspan><tspan x="1730" dy="39">StateFlow</tspan></text></g><g data-node="Compose"><rect x="1235" y="1038.5" width="430" height="83" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="1450" y="1080" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="1450" dy="0">Android Compose 消费</tspan></text></g><g data-node="Swift"><rect x="1795" y="1038.5" width="430" height="83" rx="14" fill="#D9E9D3" stroke="#26394F" stroke-width="5" filter="url(#shadow)"/><text x="2010" y="1080" font-size="30" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middle"><tspan x="2010" dy="0">SwiftUI 通过 bridge 消费</tspan></text></g><path data-edge="UI-&gt;Logic" d="M297 640 H410" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Logic-&gt;Native" d="M710 701 V820 H809 V958.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Logic-&gt;Cost" d="M830 640 H950" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Cost-&gt;Native" d="M1070 701 V820 H971 V958.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Cost-&gt;Shared" d="M1160 579 V450 H1500.5 V280 H1580.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Shared-&gt;Compose" d="M1610 360.5 V700 H1450 V1038.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-edge="Shared-&gt;Swift" d="M1850 360.5 V700 H2010 V1038.5" fill="none" stroke="#26394F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="737.5" y="760" width="45" height="40" rx="9" fill="#FFF8ED"/><text x="760" y="780" font-size="21" font-weight="750" text-anchor="middle" fill="#26394F" dominant-baseline="middl